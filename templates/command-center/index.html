<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RapidX Command</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060B16; --panel:#0B1424; --panel-2:#0E1930; --raise:#132039;
  --line:#1B2A45; --line-b:#2A4470;
  --text:#DCE7F7; --dim:#7C90B0; --faint:#4A5C7A;
  --impl:#4D9FFF; --impl-g:rgba(77,159,255,.5);
  --verify:#3DE8A0; --verify-g:rgba(61,232,160,.45);
  --warn:#FFB84D; --warn-g:rgba(255,184,77,.45);
  --stop:#FF5C7A; --stop-g:rgba(255,92,122,.45);
  --mono:'IBM Plex Mono',monospace; --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--text);font-family:var(--body);min-height:100vh;overflow-x:hidden}
code{font-family:var(--mono);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;font-size:.92em}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg .g{position:absolute;inset:0;background-image:linear-gradient(rgba(77,159,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(77,159,255,.04) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000 25%,transparent 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.3;animation:drift 24s ease-in-out infinite alternate}
.o1{width:560px;height:560px;background:#123B6E;top:-200px;left:-140px}
.o2{width:420px;height:420px;background:#0D3D2E;top:45%;right:-180px;animation-delay:-9s}
.o3{width:400px;height:400px;background:#3A2A0E;bottom:-160px;left:28%;animation-delay:-15s}
@keyframes drift{to{transform:translate(70px,44px) scale(1.14)}}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:22px 24px 64px}

/* ---------- COMMAND BAR ---------- */
.cmdbar{display:flex;align-items:center;gap:22px;padding:14px 20px;margin-bottom:18px;
  background:linear-gradient(120deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:40px;height:40px;border-radius:11px;position:relative;background:conic-gradient(from 210deg,#1E5FCC,#4D9FFF,#2AC98F,#1E5FCC);box-shadow:0 0 22px rgba(77,159,255,.32);animation:spin 14s linear infinite;flex:none}
.mark::after{content:'';position:absolute;inset:5px;border-radius:7px;background:var(--ink)}
.mark::before{content:'';position:absolute;inset:13px;border-radius:50%;background:var(--impl);box-shadow:0 0 11px var(--impl-g);z-index:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.brand h1{font-family:var(--disp);font-size:1.1rem;font-weight:700;letter-spacing:.16em}
.brand h1 em{font-style:normal;color:var(--impl)}
.brand small{display:block;font-family:var(--mono);font-size:.6rem;color:var(--faint);letter-spacing:.1em;margin-top:2px}
.cmdbar .spacer{flex:1}
.clock{font-family:var(--mono);font-size:.76rem;color:var(--dim);letter-spacing:.06em}
.btn{font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;padding:9px 16px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line-b);background:rgba(255,255,255,.03);color:var(--text);transition:.2s}
.btn:hover{border-color:var(--impl);color:#BFE0FF;background:rgba(77,159,255,.08)}
.btn:focus-visible{outline:2px solid var(--impl);outline-offset:2px}
.btn.hold{border-color:rgba(255,184,77,.45);color:var(--warn)}
.btn.hold:hover{background:rgba(255,184,77,.1);border-color:var(--warn)}
.btn.kill{border-color:rgba(255,92,122,.45);color:var(--stop)}
.btn.kill:hover{background:rgba(255,92,122,.1);border-color:var(--stop)}

/* ---------- KPI STRIP ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;transition:.25s}
.kpi:hover{border-color:var(--line-b);transform:translateY(-2px)}
.kpi b{font-family:var(--disp);font-size:1.6rem;font-weight:700;display:block;line-height:1.1}
.kpi span{font-family:var(--mono);font-size:.58rem;color:var(--faint);letter-spacing:.13em;text-transform:uppercase;display:block;margin-top:6px}
.kpi .edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-b)}
.kpi.k-impl b{color:var(--impl)} .kpi.k-impl .edge{background:var(--impl);box-shadow:0 0 12px var(--impl-g)}
.kpi.k-warn b{color:var(--warn)} .kpi.k-warn .edge{background:var(--warn);box-shadow:0 0 12px var(--warn-g)}
.kpi.k-verify b{color:var(--verify)} .kpi.k-verify .edge{background:var(--verify);box-shadow:0 0 12px var(--verify-g)}

/* ---------- LAYOUT ---------- */
.cols{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.card > h2{font-family:var(--disp);font-size:.74rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card > h2::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--impl);box-shadow:0 0 8px var(--impl-g);flex:none}
.card > h2 .tail{margin-left:auto;font-family:var(--mono);font-size:.58rem;color:var(--faint);letter-spacing:.1em}

/* ---------- AGENT WALL ---------- */
.repo-group{margin-bottom:16px}
.repo-group:last-child{margin-bottom:0}
.repo-group .repo-name{font-family:var(--mono);font-size:.62rem;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.agent{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:14px;padding:15px 16px;
  position:relative;overflow:hidden;transition:border-color .25s,transform .25s}
.agent:hover{transform:translateY(-2px);border-color:var(--line-b)}
.agent.s-build{border-left-color:var(--impl)}
.agent.s-verify{border-left-color:var(--verify)}
.agent.s-escalated{border-left-color:var(--warn);background:linear-gradient(140deg,rgba(255,184,77,.07),var(--panel-2) 55%)}
.agent.s-silent{border-left-color:var(--warn)}
.agent.s-paused{border-left-color:var(--faint);opacity:.62}
.agent.s-done{border-left-color:var(--verify);opacity:.8}
.agent .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.agent .id{font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--text)}
.agent .repo{font-family:var(--mono);font-size:.6rem;color:var(--faint);margin-top:3px}
.state{margin-left:auto;font-family:var(--mono);font-size:.54rem;letter-spacing:.13em;padding:4px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.state.build{color:var(--impl);border:1px solid rgba(77,159,255,.4);background:rgba(77,159,255,.1)}
.state.verify{color:var(--verify);border:1px solid rgba(61,232,160,.4);background:rgba(61,232,160,.1)}
.state.escalated,.state.silent{color:var(--warn);border:1px solid rgba(255,184,77,.45);background:rgba(255,184,77,.12);animation:flash 1.6s ease-in-out infinite}
.state.paused{color:var(--faint);border:1px solid var(--line-b)}
.state.done{color:var(--verify);border:1px solid rgba(61,232,160,.35)}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.42}}
.agent .phase{font-family:var(--mono);font-size:.7rem;color:#BFE0FF;margin-bottom:4px}
.agent.s-verify .phase{color:#9ADFC0}
.agent .last{font-size:.74rem;color:var(--dim);line-height:1.45;min-height:2.1em;margin-bottom:10px;word-break:break-word}
.lane{display:flex;gap:2px;height:6px;border-radius:99px;overflow:hidden;margin-bottom:10px;background:var(--line)}
.lane i{display:block;flex:1;background:var(--line)}
.lane i.impl{background:var(--impl)} .lane i.verify{background:var(--verify)}
.lane i.warn{background:var(--warn)} .lane i.stop{background:var(--stop)}
.agent .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.agent .m{font-family:var(--mono)}
.agent .m b{display:block;font-size:.8rem;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent .m span{display:block;font-size:.52rem;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.agent .acts{display:flex;gap:7px;flex-wrap:wrap}
.mini{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;padding:6px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line-b);background:transparent;color:var(--dim);transition:.2s}
.mini:hover{color:var(--text);border-color:var(--impl)}
.mini.s:hover{border-color:var(--stop);color:var(--stop)}
.mini:focus-visible{outline:2px solid var(--impl);outline-offset:2px}

/* ---------- ESCALATIONS ---------- */
.esc{border:1px solid rgba(255,184,77,.35);background:linear-gradient(140deg,rgba(255,184,77,.07),transparent 60%);
  border-radius:13px;padding:15px;margin-bottom:12px;animation:enter .5s ease}
.esc:last-child{margin-bottom:0}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.esc .who{font-family:var(--mono);font-size:.58rem;color:var(--warn);letter-spacing:.1em;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.esc .q{font-size:.83rem;line-height:1.5;margin-bottom:8px;font-weight:600}
.esc .ctx{font-family:var(--mono);font-size:.63rem;color:var(--dim);background:rgba(0,0,0,.32);border:1px solid var(--line);
  border-radius:7px;padding:8px 10px;margin-bottom:11px;line-height:1.5}
.esc .opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{font-family:var(--mono);font-size:.62rem;padding:8px 13px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(255,184,77,.4);background:rgba(255,184,77,.08);color:var(--warn);transition:.2s}
.opt:hover{background:var(--warn);color:#1A1000;border-color:var(--warn)}
.opt:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.esc input{flex:1;min-width:120px;font-family:var(--mono);font-size:.68rem;color:var(--text);
  background:rgba(0,0,0,.3);border:1px solid var(--line-b);border-radius:8px;padding:8px 10px}
.esc input:focus{outline:none;border-color:var(--warn)}
.esc .note{font-family:var(--mono);font-size:.56rem;color:var(--faint);margin-top:10px;line-height:1.5}
.esc.resolved{border-color:rgba(61,232,160,.4);background:linear-gradient(140deg,rgba(61,232,160,.07),transparent 60%)}
.empty{font-family:var(--mono);font-size:.66rem;color:var(--faint);text-align:center;padding:22px 10px;line-height:1.7}
.empty b{display:block;color:var(--verify);font-size:.72rem;margin-bottom:6px;letter-spacing:.1em}

/* ---------- FLEET BY REPO ---------- */
.repoStat{margin-bottom:12px}
.repoStat:last-child{margin-bottom:0}
.repoStat .rn{font-family:var(--mono);font-size:.68rem;color:var(--text);margin-bottom:6px}
.repoStat .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;padding:3px 8px;border-radius:99px;border:1px solid var(--line-b);color:var(--dim)}
.chip.build{color:var(--impl);border-color:rgba(77,159,255,.4)}
.chip.verify{color:var(--verify);border-color:rgba(61,232,160,.4)}
.chip.warn{color:var(--warn);border-color:rgba(255,184,77,.4)}
.chip.done{color:var(--faint);border-color:var(--line-b)}

/* ---------- STREAM ---------- */
.stream{display:flex;flex-direction:column-reverse;gap:8px;max-height:400px;overflow-y:auto;padding-right:5px}
.stream::-webkit-scrollbar{width:5px}
.stream::-webkit-scrollbar-thumb{background:var(--line-b);border-radius:99px}
.ev{display:flex;gap:11px;align-items:baseline;font-size:.74rem;padding:9px 11px;border-radius:9px;
  background:rgba(255,255,255,.015);border:1px solid var(--line);border-left:2px solid var(--faint);animation:enter .45s ease}
.ev.impl{border-left-color:var(--impl)} .ev.verify{border-left-color:var(--verify)}
.ev.warn{border-left-color:var(--warn)} .ev.stop{border-left-color:var(--stop)}
.ev .t{font-family:var(--mono);font-size:.58rem;color:var(--faint);flex:none}
.ev .who{font-family:var(--mono);font-size:.58rem;color:var(--dim);flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev span:last-child{color:var(--text);line-height:1.45}
.ev.warn span:last-child{color:var(--warn)} .ev.stop span:last-child{color:var(--stop)} .ev.verify span:last-child{color:#9ADFC0}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;padding:13px 22px;border-radius:11px;
  background:var(--raise);border:1px solid var(--impl);color:#BFE0FF;box-shadow:0 12px 40px rgba(0,0,0,.6);transition:.35s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1180px){.cols{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:16px 14px 48px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div class="bg"><div class="g"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<div class="wrap">
  <div class="cmdbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>RAPIDX <em>COMMAND</em></h1>
        <small>CLAUDE CODE FLEET &middot; OBSERVE &amp; INTERRUPT</small>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="clock" id="clock"></span>
    <button class="btn hold" id="holdAllBtn">HOLD FLEET</button>
    <button class="btn kill" id="stopAllBtn">STOP ALL</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="cols">
    <div class="stack">
      <section class="card">
        <h2>Agent Wall <span class="tail" id="wallTail">0 ACTIVE</span></h2>
        <div id="wall"><div class="empty">Waiting for events&hellip; run <code>/rapidx:command-center</code> in a repo to opt it in.</div></div>
      </section>

      <section class="card">
        <h2>Unified Event Stream <span class="tail">LIVE</span></h2>
        <div class="stream" id="stream"></div>
      </section>
    </div>

    <div class="stack">
      <section class="card">
        <h2>Escalation Inbox <span class="tail" id="escTail">CLEAR</span></h2>
        <div id="escList"><div class="empty"><b>INBOX CLEAR</b>No agent is waiting on a human decision.</div></div>
      </section>

      <section class="card">
        <h2>Fleet by Repo <span class="tail">LIVE</span></h2>
        <div id="repoBox"><div class="empty">No repos reporting yet.</div></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var STREAM_CAP = 60;
  var LANE_CAP = 24;
  var lanes = {}; // correlation_id -> array of event_type buckets
  var streamEl = document.getElementById('stream');
  var streamCount = 0;
  var lastKpiKey = '';
  var lastWallKey = '';
  var lastEscKey = '';
  var toastTimer;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function laneClass(eventType, status) {
    if (eventType === 'escalation' || eventType === 'blocked') return 'warn';
    if (eventType === 'error' || status === 'error') return 'stop';
    if (eventType === 'verification') return 'verify';
    return 'impl';
  }

  function fmtElapsed(ts) {
    if (!ts) return '';
    var ms = Date.now() - Date.parse(ts);
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    if (s < 60) return s + 's ago';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    return Math.floor(m / 60) + 'h ago';
  }

  function fmtTokens(n) {
    n = n || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
    return String(n);
  }

  var STATE_LABEL = {
    build: 'BUILDING', verify: 'VERIFYING', escalated: 'NEEDS YOU',
    silent: 'SILENT', paused: 'HELD', done: 'VERIFIED',
  };

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function renderKpis(kpis) {
    var key = JSON.stringify(kpis);
    if (key === lastKpiKey) return;
    lastKpiKey = key;
    var el = document.getElementById('kpis');
    var items = [
      ['k-impl', kpis.running, 'agents running'],
      ['k-warn', kpis.awaiting, 'awaiting you'],
      ['', kpis.events_today, 'events today'],
      ['k-verify', fmtTokens(kpis.tokens_observed), 'tokens observed'],
    ];
    el.innerHTML = items.map(function (it) {
      return '<div class="kpi ' + it[0] + '"><div class="edge"></div><b>' + escapeHtml(it[1]) + '</b><span>' + escapeHtml(it[2]) + '</span></div>';
    }).join('');
  }

  function renderLane(correlationId) {
    var buf = lanes[correlationId] || [];
    return buf.slice(-LANE_CAP).map(function (cls) { return '<i class="' + cls + '"></i>'; }).join('');
  }

  function agentCard(a) {
    var lastMsg = a.last_message || a.last_event_type || 'no activity yet';
    var state = a.status;
    var stateLabel = STATE_LABEL[state] || state.toUpperCase();
    var canHold = ['build', 'verify', 'silent'].indexOf(state) !== -1;
    var meta = [a.phase, a.loop, a.branch].filter(Boolean).map(escapeHtml).join(' &middot; ');
    return (
      '<article class="agent s-' + escapeHtml(state) + '" data-cid="' + escapeHtml(a.correlation_id) + '">' +
        '<div class="top">' +
          '<div><div class="id">' + escapeHtml(a.agent_id || a.correlation_id) + '</div><div class="repo">' + escapeHtml(a.repo || 'unknown repo') + '</div></div>' +
          '<span class="state ' + escapeHtml(state) + '">' + escapeHtml(stateLabel) + '</span>' +
        '</div>' +
        (meta ? '<div class="phase">&#9656; ' + meta + '</div>' : '') +
        '<div class="last">' + escapeHtml(lastMsg) + '</div>' +
        '<div class="lane" id="lane-' + escapeHtml(a.correlation_id) + '">' + renderLane(a.correlation_id) + '</div>' +
        '<div class="grid3">' +
          '<div class="m"><b>' + escapeHtml(fmtElapsed(a.last_ts)) + '</b><span>last seen</span></div>' +
          '<div class="m"><b>' + (a.events || 0) + '</b><span>events</span></div>' +
          '<div class="m"><b>' + fmtTokens((a.tokens_in || 0) + (a.tokens_out || 0)) + '</b><span>tokens</span></div>' +
        '</div>' +
        '<div class="acts">' +
          (canHold ? '<button class="mini" data-action="hold" data-cid="' + escapeHtml(a.correlation_id) + '">HOLD</button>' : '') +
          (state === 'paused' ? '<button class="mini" data-action="resume" data-cid="' + escapeHtml(a.correlation_id) + '">RESUME</button>' : '') +
          (state !== 'done' ? '<button class="mini s" data-action="kill" data-cid="' + escapeHtml(a.correlation_id) + '">STOP</button>' : '') +
        '</div>' +
      '</article>'
    );
  }

  function groupByRepo(agents) {
    var groups = {}, order = [];
    agents.forEach(function (a) {
      var repo = a.repo || 'unknown repo';
      if (!groups[repo]) { groups[repo] = []; order.push(repo); }
      groups[repo].push(a);
    });
    return { groups: groups, order: order };
  }

  function renderWall(agents) {
    var key = JSON.stringify(agents.map(function (a) {
      return [a.correlation_id, a.status, a.last_message, a.last_ts, a.phase, a.loop, a.events, a.tokens_in, a.tokens_out];
    }));
    if (key === lastWallKey) return;
    lastWallKey = key;
    var el = document.getElementById('wall');
    if (!agents.length) {
      el.innerHTML = '<div class="empty">Waiting for events&hellip; run <code>/rapidx:command-center</code> in a repo to opt it in.</div>';
    } else {
      var g = groupByRepo(agents);
      el.innerHTML = g.order.map(function (repo) {
        return '<div class="repo-group"><div class="repo-name">' + escapeHtml(repo) + '</div>' +
          '<div class="wall">' + g.groups[repo].map(agentCard).join('') + '</div></div>';
      }).join('');
    }
    document.getElementById('wallTail').textContent =
      agents.filter(function (a) { return a.status !== 'done'; }).length + ' ACTIVE';
    renderRepoBox(agents);
  }

  function renderRepoBox(agents) {
    var box = document.getElementById('repoBox');
    if (!agents.length) {
      box.innerHTML = '<div class="empty">No repos reporting yet.</div>';
      return;
    }
    var g = groupByRepo(agents);
    box.innerHTML = g.order.map(function (repo) {
      var list = g.groups[repo];
      var counts = { build: 0, verify: 0, warn: 0, done: 0 };
      list.forEach(function (a) {
        if (a.status === 'build') counts.build++;
        else if (a.status === 'verify') counts.verify++;
        else if (a.status === 'escalated' || a.status === 'silent') counts.warn++;
        else counts.done++;
      });
      var chips = [];
      if (counts.build) chips.push('<span class="chip build">' + counts.build + ' building</span>');
      if (counts.verify) chips.push('<span class="chip verify">' + counts.verify + ' verifying</span>');
      if (counts.warn) chips.push('<span class="chip warn">' + counts.warn + ' needs you</span>');
      if (counts.done) chips.push('<span class="chip done">' + counts.done + ' idle/done</span>');
      return '<div class="repoStat"><div class="rn">' + escapeHtml(repo) + '</div><div class="chips">' + chips.join('') + '</div></div>';
    }).join('');
  }

  function escCard(e) {
    var opts = (e.options || []).map(function (o) {
      return '<button class="opt" data-esc-answer="' + escapeHtml(e.id) + '" data-answer="' + escapeHtml(o) + '">' + escapeHtml(o) + '</button>';
    }).join('');
    if (!opts) {
      opts = '<input type="text" placeholder="type an answer&hellip;" data-esc-input="' + escapeHtml(e.id) + '" />' +
        '<button class="opt" data-esc-submit="' + escapeHtml(e.id) + '">Record</button>';
    }
    return (
      '<div class="esc" data-eid="' + escapeHtml(e.id) + '">' +
        '<div class="who">&#9674; ' + escapeHtml(e.agent_id || '') + '<span style="margin-left:auto;color:var(--faint)">' + escapeHtml(e.repo || '') + '</span></div>' +
        '<div class="q">' + escapeHtml(e.question) + '</div>' +
        (e.context ? '<div class="ctx">' + escapeHtml(e.context) + '</div>' : '') +
        '<div class="opts">' + opts + '</div>' +
        '<div class="note">Recorded as an audit decision only &mdash; does not yet auto-resume the agent (no ask_operator tool wired up in this MVP).</div>' +
      '</div>'
    );
  }

  function renderEscalations(list) {
    var key = JSON.stringify(list.map(function (e) { return [e.id, e.question]; }));
    if (key === lastEscKey) return;
    lastEscKey = key;
    var el = document.getElementById('escList');
    el.innerHTML = list.length ? list.map(escCard).join('') : '<div class="empty"><b>INBOX CLEAR</b>No agent is waiting on a human decision.</div>';
    document.getElementById('escTail').textContent = list.length ? list.length + ' WAITING' : 'CLEAR';
  }

  function renderState(state) {
    renderKpis(state.kpis);
    renderWall(state.agents);
    renderEscalations(state.escalations);
  }

  function pushEvent(evt) {
    var cls = laneClass(evt.event_type, evt.status);
    if (evt.correlation_id) {
      lanes[evt.correlation_id] = (lanes[evt.correlation_id] || []).concat([cls]).slice(-LANE_CAP);
      var laneEl = document.getElementById('lane-' + evt.correlation_id);
      if (laneEl) laneEl.innerHTML = renderLane(evt.correlation_id);
    }

    var row = document.createElement('div');
    row.className = 'ev ' + cls;
    var summary = (evt.payload && evt.payload.summary) || evt.event_type;
    row.innerHTML = '<span class="t">' + escapeHtml((evt.ts || '').slice(11, 19)) + '</span>' +
      '<span class="who">' + escapeHtml(evt.agent_id || evt.correlation_id || '') + '</span>' +
      '<span>' + escapeHtml(summary) + '</span>';
    streamEl.appendChild(row);
    streamCount++;
    while (streamCount > STREAM_CAP && streamEl.firstChild) {
      streamEl.removeChild(streamEl.firstChild);
      streamCount--;
    }
  }

  function connect() {
    var es = new EventSource('/api/events');
    es.addEventListener('state', function (ev) {
      try { renderState(JSON.parse(ev.data)); } catch (_) {}
    });
    es.addEventListener('agent_event', function (ev) {
      try { pushEvent(JSON.parse(ev.data)); } catch (_) {}
    });
    es.onerror = function () { /* EventSource auto-reconnects */ };
  }

  function poll() {
    fetch('/api/state').then(function (r) { return r.json(); }).then(renderState).catch(function () {});
  }

  function postControl(correlationId, action) {
    fetch('/api/control', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correlation_id: correlationId, action: action }),
    }).catch(function () {});
    toast(action.toUpperCase() + ' → ' + correlationId);
  }

  function answerEscalation(id, answer) {
    if (!answer) return;
    fetch('/api/escalations/' + encodeURIComponent(id) + '/answer', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer: answer }),
    }).catch(function () {});
    toast('DECISION LOGGED → ' + id);
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.dataset.action && t.dataset.cid) { postControl(t.dataset.cid, t.dataset.action); return; }
    if (t.dataset.escAnswer) { answerEscalation(t.dataset.escAnswer, t.dataset.answer); return; }
    if (t.dataset.escSubmit) {
      var input = document.querySelector('[data-esc-input="' + t.dataset.escSubmit + '"]');
      answerEscalation(t.dataset.escSubmit, input ? input.value : '');
      return;
    }
    if (t.id === 'holdAllBtn' || t.id === 'stopAllBtn') {
      var action = t.id === 'holdAllBtn' ? 'hold' : 'kill';
      document.querySelectorAll('.agent[data-cid]').forEach(function (card) {
        postControl(card.getAttribute('data-cid'), action);
      });
    }
  });

  function tickClock() {
    var d = new Date();
    var h = String(d.getHours()).padStart(2, '0'), m = String(d.getMinutes()).padStart(2, '0'), s = String(d.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = h + ':' + m + ':' + s + ' LOCAL';
  }
  tickClock();
  setInterval(tickClock, 1000);

  connect();
  poll();
  setInterval(poll, 8000);
})();
</script>
</body>
</html>
